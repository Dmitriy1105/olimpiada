name: Mars agent checks

on:
  push:
    branches: [task-06-mars-v1, task-06-mars-v4]
    paths:
      - "mars/**"
      - ".github/workflows/mars-tests.yml"
  pull_request:
    paths:
      - "mars/**"
      - ".github/workflows/mars-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and interactive protocol tests
        run: python -m unittest -v mars.test_solution
      - name: Exact history validation
        run: python mars/simulate.py
      - name: Diagnostic fixed-history replay
        run: python mars/benchmark_replay.py
      - name: Paired v1 versus v4 replay
        run: python mars/benchmark_compare.py
